# Secret scan of staged changes on commit (hook in .githooks/pre-commit)
# gitleaks is pinned in the repo's mise.toml
- name: trust the repo's mise.toml
  command: "/Users/{{ user }}/.local/bin/mise trust {{ playbook_dir }}/mise.toml"
  changed_when: false
  tags: [gitleaks, ai]

- name: install the repo's mise tools
  command: "/Users/{{ user }}/.local/bin/mise install"
  args:
    chdir: "{{ playbook_dir }}"
  changed_when: false
  tags: [gitleaks, ai]

- name: current hooksPath
  command: git -C {{ playbook_dir }} config --get core.hooksPath
  register: hooks_path
  changed_when: false
  failed_when: false
  tags: [gitleaks, ai]

- name: use the repo's git hooks
  command: git -C {{ playbook_dir }} config core.hooksPath .githooks
  when: hooks_path.stdout != '.githooks'
  tags: [gitleaks, ai]
