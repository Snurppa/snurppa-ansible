# Python CLI tools as uv tools (isolated envs, executables in ~/.local/bin).
# uv itself comes from Homebrew (group_vars/all), Python is fetched by uv on demand.
- name: uv tools
  command: "uv tool install {{ item.args | default('') }} {{ item.name }}"
  args:
    creates: "/Users/{{ user }}/.local/share/uv/tools/{{ item.name }}"
  loop:
    - name: ansible
      args: --with-executables-from ansible-core,ansible-lint
    - name: justhtml
  loop_control:
    label: "{{ item.name }}"
