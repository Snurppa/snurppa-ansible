# Settings live in this repo and are symlinked into place, edits on either side are the same file.
# Project specifics belong in the project's .claude/settings.local.json, not here.

- name: ~/.claude
  file:
    path: "/Users/{{ user }}/.claude"
    state: directory

# import (static) so the role's tags reach the imported tasks
- name: link settings.json from this repo
  import_tasks: "{{ playbook_dir }}/tasks/link-with-backup.yml"
  vars:
    link_src: "{{ role_path }}/files/settings.json"
    link_dest: "/Users/{{ user }}/.claude/settings.json"
