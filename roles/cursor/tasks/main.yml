# settings.json and keybindings.json are symlinked from this repo.
# cli-config.json is state-heavy (Cursor CLI rewrites it), so it is only seeded when missing.
# Not managed: ~/.cursor/mcp.json (Skillshare) and ~/.cursor/hooks.json.

- name: Cursor user dir
  file:
    path: "/Users/{{ user }}/Library/Application Support/Cursor/User"
    state: directory

# import (static, no loop) so the role's tags reach the imported tasks
- name: link Cursor settings.json from this repo
  import_tasks: "{{ playbook_dir }}/tasks/link-with-backup.yml"
  vars:
    link_src: "{{ role_path }}/files/settings.json"
    link_dest: "/Users/{{ user }}/Library/Application Support/Cursor/User/settings.json"

- name: link Cursor keybindings.json from this repo
  import_tasks: "{{ playbook_dir }}/tasks/link-with-backup.yml"
  vars:
    link_src: "{{ role_path }}/files/keybindings.json"
    link_dest: "/Users/{{ user }}/Library/Application Support/Cursor/User/keybindings.json"

- name: ~/.cursor
  file:
    path: "/Users/{{ user }}/.cursor"
    state: directory

- name: seed Cursor CLI config
  copy:
    src: cli-config.json
    dest: "/Users/{{ user }}/.cursor/cli-config.json"
    force: false
