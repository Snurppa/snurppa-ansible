# Ansible and ansible-lint come from `uv tool install` (see README), no project Python needed.
# The vault password file is set in ansible.cfg.

[tools]
# Secret scan for the pre-commit hook (.githooks/pre-commit)
"aqua:gitleaks/gitleaks" = "8.30.1"

[tasks.lint]
description = "Lint Ansible playbooks"
run = "ansible-lint"

[tasks.run]
description = "Run the main playbook"
run = "ansible-playbook main.yml --ask-become-pass"
